<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - Coqui Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container-fluid vh-100">
    <div class="row h-100">

        <div class="col-md-7 d-none d-md-flex justify-content-center align-items-center text-white"
            style="
            background-image: linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)), url('/Imagenes/coqui-realplaza2.jpg');
            background-size:cover;
            background-position:center;">
            
            <div class="text-center">
                <img th:src="@{/Imagenes/logo-coqui.png}" style="width:180px">
                <h1 class="mt-4 fw-bold">Coqui Café</h1>
                <p class="lead">Sistema de Gestión Empresarial</p>
            </div>
        </div>

        <div class="col-md-5 d-flex justify-content-center align-items-center">
            <div class="card shadow-lg p-4 w-75">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-lock fa-3x text-warning"></i>
                    <h3 class="mt-3">Iniciar Sesión</h3>
                </div>

                <form th:action="@{/login}" method="post">
                 
                    <!-- Mensajes -->
                    <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                        Error: contraseña y/o usuario incorrecto.
                    </div>
                    <div th:if="${param.inactivo}" class="alert alert-danger text-center" role="alert">
                        Error. Usuario inactivo o inexistente.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                        Sesión cerrada correctamente.
                    </div>
                    <div th:if="${param.registrado}" class="alert alert-success text-center" role="alert">
                        Registro exitoso. Inicia sesión.
                    </div>
                    <div th:if="${success}" class="alert alert-success text-center" role="alert" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}"></div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Escribe tu usuario" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Escribe tu contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">
                        Ingresar
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/registro}" class="text-muted">Crear nuevo usuario</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
